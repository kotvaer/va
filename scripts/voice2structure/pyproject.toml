[project]
name = "voice2structure"
version = "0.2.0"
description = "Turn private voice recordings into traceable speaker-labelled transcripts for analysis."
requires-python = ">=3.11,<3.13"
dependencies = [
  "funasr>=1.2.7",
  "modelscope>=1.20.0",
  "soundfile>=0.13.0",
  "torch>=2.6.0",
  "torchaudio>=2.6.0",
]

[project.scripts]
voice2structure = "voice2structure.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice2structure"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
